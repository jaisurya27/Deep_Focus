[project]
name = "deep-focus-backend"
version = "0.1.0"
description = "Local FastAPI backend for the Deep Focus desktop agent."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.3",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
